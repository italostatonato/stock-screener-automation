name: Weekly FII Screener

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/assets/**"
      - "docs/data/**"
      - ".github/workflows/run_screener.yml"
      - ".github/workflows/publish_dashboard.yml"
      - "scripts/dashboard_release.py"
  schedule:
    - cron: "0 13 * * 1" # segunda-feira, 10h de Brasília
    - cron: "17 13,14 * * 1" # contingência às 10h17 e às 11h17
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Republicar a última coleta salva"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: screener-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Rodar testes
        run: pytest tests/ -v

  screener:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'push' && !inputs.publish_only }}
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - name: Verificar necessidade de nova coleta
        id: plan
        run: python3 scripts/dashboard_release.py plan --event "$GITHUB_EVENT_NAME" --output "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5.6.0
        if: steps.plan.outputs.collect == 'true'
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Instalar dependências
        if: steps.plan.outputs.collect == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: browser-actions/setup-chrome@v2
        if: steps.plan.outputs.collect == 'true'

      - name: Rodar screener
        if: steps.plan.outputs.collect == 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          python -u main.py 2>&1 | tee logs/pipeline.log

      - name: Preservar diagnóstico da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screener-failure-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Healthcheck dos dados
        if: steps.plan.outputs.collect == 'true'
        env:
          MINIMUM_DATE: ${{ steps.plan.outputs.minimum_date }}
        run: |
          python scripts/healthcheck_data.py
          python scripts/dashboard_release.py validate --minimum-date "$MINIMUM_DATE"

      - name: Salvar Excel e relatórios como artefato
        if: steps.plan.outputs.collect == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stock-screener-output-${{ github.run_id }}
          path: |
            data/output/
            docs/data/
            data/lake/quality_report.json
            data/lake/manifest.json
          retention-days: 90

      - name: Commitar dados gerados
        if: steps.plan.outputs.collect == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          [ -d docs/data ] && git add docs/data/
          [ -d data/lake ] && git add data/lake/
          [ -d data/ml ] && git add data/ml/
          [ -d data/backtest ] && git add data/backtest/
          [ -d data/delivery ] && git add data/delivery/

          if git diff --cached --quiet; then
            echo "Sem alterações de dados para commitar."
            exit 0
          fi

          git commit -m "chore: atualiza dados do screener"
          git pull --rebase origin main
          git push origin main

      - name: Notificar falha no Telegram
        if: failure()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="Screener falhou: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "Secrets do Telegram não configurados; pulando notificação."
          fi
