paths:
  # Caminhos relativos à raiz do projeto — o repositório é compartilhado,
  # então nada aqui pode depender da máquina de quem roda.
  data_dir: "data"
  input_dir: "data/input"
  output_dir: "data/output"
  old_dir: "data/old"
  logs_dir: "logs"
  local_input_file: "data/input/Ranking_Acoes_FII.xlsx"

  # Destino local opcional do Excel final (OneDrive, Dropbox, pasta de rede).
  # Defina SCREENER_EXCEL_OUTPUT_DIR para ativar; vazio pula a cópia.
  # No GitHub Actions fica naturalmente vazio.
  onedrive_output_dir: "${SCREENER_EXCEL_OUTPUT_DIR}"

scraper:
  url: "https://www.fundsexplorer.com.br/ranking"
  # Ações: consulta semanal a uma tabela pública, sem conta ou chave.
  acoes_source: "fundamentus"
  fundamentus_url: "https://www.fundamentus.com.br/resultado.php"
  fundamentus_timeout: 30

  # Alternativa opcional para quem possuir plano Pro da brapi. Não é usada
  # enquanto acoes_source estiver como "fundamentus".
  brapi_base_url: "https://brapi.dev/api"
  brapi_token: "${BRAPI_TOKEN}"
  brapi_timeout: 30
  # O plano Pro permite os fundamentos; eles são cacheados
  # por 30 dias e a cotação é atualizada diariamente pela listagem pública.
  brapi_batch_size: 10
  brapi_page_size: 100
  brapi_workers: 6
  brapi_fundamentals_ttl_days: 30
  brapi_cache_file: "data/lake/brapi_acoes_fundamentals.parquet"
  wait_timeout: 20
  page_load_timeout: 45
  download_timeout: 45
  sleep_after_load: 4
  cookie_button_id: "didomi-notice-agree-button"

filters:
  pvp_max: 1.15        # mantido só como referência, não usado no quartil
  dy_min: 0.003        # mínimo absoluto: 0,3% — elimina FIIs sem dividendo
  liquidez_min: 100000 # mínimo absoluto: R$ 100k
  patrimonio_min: 50000000  # mínimo absoluto: R$ 50M
  volatilidade_max: 50.0
  top_n: 20
  acoes:
    dy_min: 0.02       # mínimo absoluto: 2%
    volume_min: 500000 # mínimo absoluto: R$ 500k
    market_cap_min: 200000000  # mínimo absoluto: R$ 200M
    top_n: 20

columns:
  percent:
    - "DIVIDEND YIELD"
    - "DY (3M) ACUMULADO"
    - "DY (6M) ACUMULADO"
    - "DY (12M) ACUMULADO"
    - "DY (3M) MÉDIA"
    - "DY (6M) MÉDIA"
    - "DY (12M) MÉDIA"
    - "DY ANO"
    - "DY PATRIMONIAL"
  money:
    - "PREÇO ATUAL (R$)"
    - "LIQUIDEZ DIÁRIA (R$)"
    - "PATRIMÔNIO LÍQUIDO"
    - "VPA"
  integer:
    - "QUANT. ATIVOS"
    - "NUM. COTISTAS"
  float_simple:
    - "VOLATILIDADE"
